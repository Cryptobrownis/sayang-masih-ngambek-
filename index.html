<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jangan Ngambek Lagi Ya Sayang 🥺❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Sacramento&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0c20;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      color: #fff;
    }

    /* Canvas Animasi Hati Partikel */
    #heartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Kartu Pesan Glassmorphism */
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.2);
      max-width: 420px;
      width: 100%;
      position: relative;
      z-index: 10;
      transition: all 0.5s ease;
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff4b72;
      box-shadow: 0 0 20px #ff4b72;
    }

    .heart-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #ff4b72;
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 50%;
    }

    h1 {
      font-family: 'Sacramento', cursive;
      font-size: 2.8rem;
      color: #ff758c;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
    }

    .rayuan-box {
      background: rgba(0, 0, 0, 0.3);
      border-left: 4px solid #ff4b72;
      padding: 15px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 15px 0 25px 0;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffe6ea;
      font-style: italic;
    }

    /* Tombol Interaktif */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-maaf {
      background: linear-gradient(45deg, #ff4b72, #ff758c);
      color: white;
    }

    .btn-maaf:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px #ff4b72;
    }

    .btn-ngambek {
      background: rgba(255, 255, 255, 0.2);
      color: #eee;
      position: absolute;
      right: 10px;
    }

    /* Pop-up Modal */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .popup-box {
      background: #1a162b;
      border: 2px solid #ff4b72;
      padding: 30px 20px;
      border-radius: 20px;
      max-width: 350px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 75, 114, 0.4);
      animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-box h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #ff758c;
      margin-bottom: 10px;
    }

    .popup-box p {
      font-size: 0.95rem;
      color: #ddd;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Canvas Animasi Hati Partikel -->
  <canvas id="heartCanvas"></canvas>

  <!-- Kartu Utama Bujukan -->
  <div class="card" id="mainCard">
    <div class="avatar-wrapper">
      <!-- Kamu bisa ganti URL gambar di bawah dengan foto pacarmu -->
      <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Foto Pacar">
      <span class="heart-badge">🥺</span>
    </div>
    
    <h1>Maafin Aku Ya Sayang...</h1>

    <div class="rayuan-box" id="rayuanText">
      "Aku tahu aku salah... Tapi tau gak? Dunia aku sepi banget kalau kamu lagi cuek dan ngambek kayak gini 🥺"
    </div>

    <div class="btn-group" id="btnArea">
      <button class="btn btn-maaf" onclick="terimaMaaf()">Udah Enggak Ngambek ❤️</button>
      <button class="btn btn-ngambek" id="btnKabur" onmouseover="kaburTombol()" onclick="kaburTombol()">Masih Kesel! 😤</button>
    </div>
  </div>

  <!-- Pop-Up Penutup Setelah Dimaafkan -->
  <div class="overlay" id="popupSukses">
    <div class="popup-box">
      <h2>Yeeeay! Makasih Cantik 🥰✨</h2>
      <p>Janji deh habis ini gak bakal bikin kamu kesel lagi. Makasih ya udah mau maafin aku... Sayang kamu banget! ❤️</p>
      <button class="btn btn-maaf" style="width: 100%;" onclick="selesai()">Kirim Peluk & Cium 🤗💋</button>
    </div>
  </div>

  <script>
    // 1. DAFTAR RAYUAN BERGANTI-GANTI SAAT TOMBOL DITEKAN/DI-HOVER
    const rayuanList = [
      "Jangan ngambek lagi dong... Senyum dikit aja, cantiknya langsung nambah 1000%! ✨",
      "Kalau kamu ngambek terus, nanti bintang di langit cemburu sama manisnya muka cemberut kamu 🥺",
      "Boba paling enak di dunia pun rasanya hambar kalau gak diminum bareng kamu pas lagi senyum 💕",
      "Aku minta maaf ya cantik... Satu senyuman kamu hari ini bisa nyelamatin mood aku seharian penuh ❤️",
      "Udah dong ngambeknya... Nanti aku beliin makanan favorit kamu + peluk erat deh! 🤗"
    ];

    let rayuanIndex = 0;

    // 2. LOGIK TOMBOL KABUR (Bikin pacar gemes gak bisa tekan 'Masih Kesel')
    function kaburTombol() {
      const btn = document.getElementById('btnKabur');
      
      // Ubah posisi tombol secara acak
      const x = Math.random() * (window.innerWidth - 150) - (window.innerWidth / 2) + 100;
      const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2) + 50;

      btn.style.transform = `translate(${x}px, ${y}px)`;

      // Ganti teks rayuan secara bergantian
      rayuanIndex = (rayuanIndex + 1) % rayuanList.length;
      document.getElementById('rayuanText').innerText = `"${rayuanList[rayuanIndex]}"`;
    }

    function terimaMaaf() {
      document.getElementById('popupSukses').style.display = 'flex';
    }

    function selesai() {
      document.getElementById('popupSukses').style.display = 'none';
      alert("I Love You So Much! ❤️ Cepat bales chat aku ya!");
    }

    // 3. ANIMASI CANVAS PARTIKEL MEMBENTUK HATI SHAPE
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Rumus Matematika Bentuk Hati
    function heartPosition(t) {
      const scale = Math.min(width, height) / 45;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale - 20
      };
    }

    class Particle {
      constructor() {
        this.t = Math.random() * Math.PI * 2;
        const target = heartPosition(this.t);
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.targetX = target.x;
        this.targetY = target.y;
        this.size = Math.random() * 3 + 1.5;
        this.speed = Math.random() * 0.03 + 0.01;
        this.color = `hsl(${Math.random() * 30 + 340}, 100%, 65%)`;
      }

      update() {
        // Efek bergerak membentuk bentuk hati
        this.x += (this.targetX - this.x) * this.speed;
        this.y += (this.targetY - this.y) * this.speed;

        // Efek denyut halus
        this.t += 0.005;
        const newTarget = heartPosition(this.t);
        this.targetX = newTarget.x;
        this.targetY = newTarget.y;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff4b72';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = Array.from({ length: 350 }, () => new Particle());

    function animate() {
      ctx.fillStyle = 'rgba(15, 12, 32, 0.2)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
